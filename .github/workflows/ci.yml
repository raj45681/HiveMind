name: Development checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      semantic_tests:
        description: Run optional local semantic model checks (downloads the model)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python hive.py init
      - run: python hive.py doctor --human
      - run: python hive.py verify
      - name: Retrieval regression report
        shell: bash
        run: python hive.py benchmark --check > benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-${{ matrix.os }}-${{ matrix.python }}
          path: benchmark.json
          if-no-files-found: ignore

  semantic:
    name: Optional real semantic retrieval
    if: github.event_name == 'workflow_dispatch' && inputs.semantic_tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: runtime/models/semantic
          key: semantic-fastembed-0.8.1-bge-small-en-v1.5
      - run: python -m pip install -r requirements.txt
      - run: python hive.py semantic-setup
      - run: python -m unittest discover -s tests -p test_semantic.py -v
      - name: Semantic retrieval regression report
        run: python hive.py benchmark --semantic --check > benchmark-semantic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-semantic
          path: benchmark-semantic.json
          if-no-files-found: ignore
