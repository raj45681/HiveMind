name: Development checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      semantic_tests:
        description: Run optional local semantic model checks (downloads the model)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Prepare project virtual environment
        shell: bash
        run: |
          python -m venv .venv
          python - <<'PY'
          import os
          from pathlib import Path
          scripts = Path.cwd() / '.venv' / ('Scripts' if os.name == 'nt' else 'bin')
          with Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8') as output:
              print(scripts, file=output)
          PY
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Unit tests
        shell: bash
        run: |
          python - <<'PY'
          import sys
          import unittest
          sys.stdout.reconfigure(encoding='utf-8')
          sys.stderr.reconfigure(encoding='utf-8')
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          for test, detail in result.failures + result.errors:
              message = (str(test) + '\n' + detail).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Unit test failure::' + message, flush=True)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - run: python hive.py init
      - run: python hive.py doctor --human
      - run: python hive.py verify
      - name: Retrieval regression report
        shell: bash
        run: python hive.py benchmark --check > benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-${{ matrix.os }}-${{ matrix.python }}
          path: benchmark.json
          if-no-files-found: ignore

  semantic:
    name: Optional real semantic retrieval
    if: github.event_name == 'workflow_dispatch' && inputs.semantic_tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: runtime/models/semantic
          key: semantic-fastembed-0.8.1-bge-small-en-v1.5
      - name: Prepare project virtual environment
        shell: bash
        run: |
          python -m venv .venv
          python - <<'PY'
          import os
          from pathlib import Path
          scripts = Path.cwd() / '.venv' / ('Scripts' if os.name == 'nt' else 'bin')
          with Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8') as output:
              print(scripts, file=output)
          PY
      - run: python -m pip install -r requirements.txt
      - run: python hive.py semantic-setup
      - run: python -m unittest discover -s tests -p test_semantic.py -v
      - name: Semantic retrieval regression report
        run: python hive.py benchmark --semantic --check > benchmark-semantic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-semantic
          path: benchmark-semantic.json
          if-no-files-found: ignore
